name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install art tooling
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Validate visual art
        run: npm run art:validate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
