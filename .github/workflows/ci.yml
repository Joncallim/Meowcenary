name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install art tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          python3 -m pip install --requirement docs/art/scripts/requirements.txt

      - name: Validate visual art
        run: npm run art:validate

      - name: Validate game content
        run: npm run content:validate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Browser viewport and touch acceptance
        id: browser
        run: npm run test:browser

      - name: Upload failed browser results
        if: ${{ failure() && steps.browser.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-results
          path: test-results/
          retention-days: 7
